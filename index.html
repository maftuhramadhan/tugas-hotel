                // Kecuali untuk Kamar 202 yang default-nya maintenance di kode sebelumnya

                if (id === '202') return 'maintenance'; // Hardcode maintenance for demo
                return 'available';
            },

            updateUnitStatus: (id, status) => {
                const statuses = JSON.parse(localStorage.getItem('rp_room_statuses')) || {};
                statuses[id] = status;
                localStorage.setItem('rp_room_statuses', JSON.stringify(statuses));

                                        <th class="py-3 px-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Tanggal</th>
                                        <th class="py-3 px-4 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Total</th>
                                        <th class="py-3 px-4 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Status</th>
                                        <th class="py-3 px-4 text-center text-xs font-bold text-gray-500 uppercase tracking-wider">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">
                                    ${bookings.length > 0 ? rows : '<tr><td colspan="7" class="text-center py-12 text-gray-400 italic">Belum ada data pesanan masuk</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>`;
            }
        };

        // ==========================================
        // 4. EVENT HANDLERS & LOGIC
        // ==========================================

        function attachListeners() {
            // Mobile Menu Toggle
            const btn = document.getElementById('mobileMenuBtn');
            if(btn) {
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);
                newBtn.addEventListener('click', toggleMenu);
            }

            // Date Input Listeners for Duration Calculation
            const checkIn = document.getElementById('checkIn');
            const checkOut = document.getElementById('checkOut');
            const durationInfo = document.getElementById('stayDurationInfo');
            const durationText = document.getElementById('durationDays');

            if (checkIn && checkOut) {
                const calculate = () => {
                    if (checkIn.value && checkOut.value) {
                        const d1 = new Date(checkIn.value);
                        const d2 = new Date(checkOut.value);
                        const timeDiff = d2.getTime() - d1.getTime();
                        const nights = Math.ceil(timeDiff / (1000 * 3600 * 24));
                        
                        if (nights > 0) {
                            durationInfo.classList.remove('hidden');
                            durationText.innerText = nights;
                        } else {
                            durationInfo.classList.add('hidden');
                        }
                    }
                };
                checkIn.addEventListener('change', calculate);
                checkOut.addEventListener('change', calculate);
            }
        }

        function toggleMenu() {
            const menu = document.getElementById('mobileMenu');
            menu.classList.toggle('hidden');
        }

        // --- Slider Logic ---
        window.changeSlide = (unitId, direction) => {
            const unit = ROOM_UNITS.find(u => u.id === unitId);
            if (!unit) return;

            const totalImages = unit.images.length;
            let currentIdx = sliderIndices[unitId] || 0;
            
            // Calculate new index
            let newIdx = currentIdx + direction;
            if (newIdx >= totalImages) newIdx = 0;
            if (newIdx < 0) newIdx = totalImages - 1;

            // Update state
            sliderIndices[unitId] = newIdx;

            // Update UI
            // 1. Hide all images, show new one
            for (let i = 0; i < totalImages; i++) {
                const img = document.getElementById(`img-${unitId}-${i}`);
                const dot = document.getElementById(`dot-${unitId}-${i}`);
                if (img && dot) {
                    if (i === newIdx) {
                        img.classList.remove('opacity-0', 'z-0');
                        img.classList.add('opacity-100', 'z-10');
                        dot.classList.remove('bg-opacity-50', 'w-2');
                        dot.classList.add('bg-opacity-100', 'w-4');
                    } else {
                        img.classList.remove('opacity-100', 'z-10');
                        img.classList.add('opacity-0', 'z-0');
                        dot.classList.remove('bg-opacity-100', 'w-4');
                        dot.classList.add('bg-opacity-50', 'w-2');
                    }
                }
            }
        };

        // --- Booking Logic ---
        window.handleBookingSubmit = (e, unitId) => {
            e.preventDefault();
            
            const checkIn = document.getElementById('checkIn').value;
            const checkOut = document.getElementById('checkOut').value;
            const guestName = document.getElementById('guestName').value;
            const guestPhone = document.getElementById('guestPhone').value;
            const guestNotes = document.getElementById('guestNotes').value;

            // Hitung durasi malam
            const d1 = new Date(checkIn);
            const d2 = new Date(checkOut);
            const timeDiff = d2.getTime() - d1.getTime();
            const nights = Math.ceil(timeDiff / (1000 * 3600 * 24));

            if (nights <= 0) {
                alert("Tanggal Check-out harus setelah Check-in!");
                return;
            }

            const unit = ROOM_UNITS.find(u => u.id === unitId);
            const cat = ROOM_CATEGORIES.find(c => c.id === unit.categoryId);

            // Simpan ke state sementara (tempBooking)
            tempBooking = {
                id: Date.now().toString(),
                categoryId: cat.id,
                roomName: cat.name,
                unitId: unit.id,
                unitName: unit.name,
                pricePerNight: unit.price,
                checkIn, checkOut, nights,
                guestName, guestPhone, guestNotes,
                totalPrice: unit.price * nights,
                status: 'Pending Payment'
            };

            // Pindah ke halaman pembayaran
            router.navigate('payment');
        };

        // --- Payment Logic ---
        window.handlePaymentSubmit = (e) => {
            e.preventDefault();
            
            // 1. Ubah status booking jadi Paid
            tempBooking.status = "Paid";
            
            // 2. Simpan Booking ke History
            db.saveBooking(tempBooking);

            // 3. UPDATE STATUS KAMAR JADI BOOKED (PENTING!)
            // Ini akan membuat kamar tidak tersedia untuk orang lain
            db.updateUnitStatus(tempBooking.unitId, 'booked');

            // Simulasi Loading
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
            btn.disabled = true;

            setTimeout(() => {
                alert("Pembayaran Berhasil! Kamar telah diamankan untuk Anda.");
                const bookingFinal = {...tempBooking};
                tempBooking = null; // Reset temp
                router.navigate('invoice', bookingFinal);
            }, 1500);
        };

        // --- WhatsApp Logic ---
        window.sendWhatsApp = (bookingId) => {
            const bookings = db.getBookings();
            const booking = bookings.find(b => b.id === bookingId);
            
            if(!booking) return;

            const text = `
*Halo Admin Royal Paradise,*
Saya telah melakukan pembayaran invoice #${booking.id}.

*Detail Pesanan:*
Nama: ${booking.guestName}
Kamar: ${booking.unitName}
Tanggal: ${booking.checkIn} s/d ${booking.checkOut}
Total: ${formatRp(booking.totalPrice)}

Mohon konfirmasinya. Terima kasih!`.trim();

            const url = `https://wa.me/${HOTEL_WA}?text=${encodeURIComponent(text)}`;
            window.open(url, '_blank');
        };

        // --- Admin Logic ---
        window.handleAdminLogin = (e) => {
            e.preventDefault();
            const u = document.getElementById('adminUser').value;
            const p = document.getElementById('adminPass').value;

            if (u === ADMIN_AUTH.user && p === ADMIN_AUTH.pass) {
                router.navigate('admin-dashboard');
            } else {
                alert("Username atau Password salah!");
            }
        };

        // --- Admin Checkout Logic ---
        window.handleCheckout = (unitId) => {
            if(confirm("Apakah Anda yakin tamu sudah check-out? Status kamar akan kembali menjadi 'Tersedia'.")) {
                db.updateUnitStatus(unitId, 'available');
                router.navigate('admin-dashboard'); // Refresh table
            }
        };

        // --- Admin Cancel Logic ---
        window.handleCancelBooking = (bookingId) => {
            if(confirm("Yakin ingin membatalkan pesanan ini? Kamar akan otomatis menjadi 'Tersedia' kembali.")) {
                const bookings = db.getBookings();
                const bookingIndex = bookings.findIndex(b => b.id === bookingId);
                
                if (bookingIndex > -1) {
                    const booking = bookings[bookingIndex];
                    
                    // Update booking status
                    booking.status = 'Cancelled';
                    bookings[bookingIndex] = booking;
                    localStorage.setItem('rp_bookings', JSON.stringify(bookings));
                    
                    // Reset room status
                    db.updateUnitStatus(booking.unitId, 'available');
                    
                    // Refresh UI
                    router.navigate('admin-dashboard');
                }
            }
        };

        // --- Search Booking Logic ---
        window.searchBooking = () => {
            const id = document.getElementById('searchId').value.trim();
            const bookings = db.getBookings();
            const result = bookings.find(b => b.id.includes(id));
            const div = document.getElementById('searchResult');

            if(result) {
                div.innerHTML = `
                    <div class="bg-white border-l-4 border-green-500 p-6 rounded shadow-md text-left fade-in">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-gray-800 text-lg mb-1">Pesanan Ditemukan</h3>
                                <p class="text-sm text-gray-500 mb-4">ID: #${result.id}</p>
                            </div>
                            <span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold uppercase">${result.status}</span>
                        </div>
                        <div class="grid grid-cols-2 gap-4 text-sm mb-4">
                            <div>
                                <p class="text-gray-500">Nama Tamu</p>
                                <p class="font-semibold">${result.guestName}</p>
                            </div>
                            <div>
                                <p class="text-gray-500">Unit Kamar</p>
                                <p class="font-semibold">${result.unitName}</p>
                            </div>
                            <div>
                                <p class="text-gray-500">Check In</p>
                                <p class="font-semibold">${result.checkIn}</p>
                            </div>
                            <div>
                                <p class="text-gray-500">Check Out</p>
                                <p class="font-semibold">${result.checkOut}</p>
                            </div>
                        </div>
                        <button onclick='router.navigate("invoice", ${JSON.stringify(result)})' class="w-full bg-gray-800 text-white px-4 py-2 rounded hover:bg-black transition">Lihat Invoice</button>
                    </div>
                `;
            } else {
                div.innerHTML = `
                <div class="bg-red-50 border border-red-200 text-red-600 p-4 rounded fade-in">
                    <i class="fa-solid fa-circle-exclamation mr-2"></i> Booking ID tidak ditemukan!
                </div>`;
            }
        };

        // Initialize App
        
        router.navigate('home');

    </script>
</body>
</html>
